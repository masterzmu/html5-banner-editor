.bg{position:absolute;inset:0;z-index:0;animation:drift 8s ease-in-out infinite}
@keyframes drift{from{transform:scale(1.04)}to{transform:scale(1.08)}}
.scrim{position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(180deg,rgba(8,6,4,.45) 0%,rgba(8,6,4,.2) 35%,rgba(8,6,4,.72) 100%)}

.perks{font-size:10px;letter-spacing:.02em;text-shadow:0 1px 4px rgba(0,0,0,.5);animation:seqPerks 8s ease-in-out infinite}
.bottom{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-shrink:0;width:100%}
.price{display:flex;flex-direction:column;animation:seqPrice 8s ease-in-out infinite}
.price .from{font-size:9px;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.price .amt{font-size:22px;font-weight:800;color:#f0d078;line-height:1.1;text-shadow:0 2px 8px rgba(0,0,0,.5)}
.cta{background:#fff;color:#1a1208;font-weight:800;font-size:12px;padding:9px 12px;border-radius:999px;white-space:nowrap;box-shadow:0 6px 16px rgba(0,0,0,.35);animation:seqCta 8s ease-in-out infinite}
.legal{position:absolute;left:10px;right:10px;bottom:3px;z-index:3;font-size:7px;text-align:center;pointer-events:none;animation:seqLegal 8s ease-in-out infinite}
@keyframes seqBrand{0%{opacity:0;transform:translateY(-10px)}6%{opacity:1;transform:none}72%{opacity:1;transform:none}86%{opacity:0;transform:translateY(-6px)}100%{opacity:0;transform:translateY(-6px)}}
@keyframes logoGlow{0%,5%{transform:scale(.7);filter:brightness(.9)}12%,70%{transform:scale(1);filter:brightness(1)}78%,100%{transform:scale(.85);filter:brightness(.85)}}
@keyframes seqTitle{0%,4%{opacity:0;transform:translateY(16px)}12%{opacity:1;transform:none}70%{opacity:1;transform:none}84%{opacity:0;transform:translateY(-8px)}100%{opacity:0;transform:translateY(-8px)}}
@keyframes seqSub{0%,8%{opacity:0;transform:translateY(12px)}16%{opacity:1;transform:none}70%{opacity:1;transform:none}84%{opacity:0;transform:translateY(-6px)}100%{opacity:0;transform:translateY(-6px)}}
@keyframes seqPerks{0%,12%{opacity:0;transform:translateY(10px)}20%{opacity:1;transform:none}70%{opacity:1;transform:none}84%{opacity:0;transform:translateY(-4px)}100%{opacity:0;transform:translateY(-4px)}}
@keyframes seqPrice{0%,16%{opacity:0;transform:translateX(-14px)}24%{opacity:1;transform:none}40%,55%{opacity:1;transform:scale(1)}48%{transform:scale(1.05)}70%{opacity:1;transform:none}84%{opacity:0;transform:translateX(-8px)}100%{opacity:0;transform:translateX(-8px)}}
