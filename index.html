<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTML5-bannerieditori</title>
<style>
:root {
  --bg: #0e1117;
  --surface: #161b22;
  --surface2: #1c2333;
  --border: #30363d;
  --text: #e6edf3;
  --text2: #8b949e;
  --accent: #58a6ff;
  --accent2: #3fb950;
  --danger: #f85149;
  --radius: 8px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
  flex-direction: column;
}

/* ── Header ── */
.header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 20px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  flex-shrink: 0;
}
.header h1 { font-size: 16px; font-weight: 700; }
.header h1 span { color: var(--text2); font-weight: 400; margin-left: 8px; font-size: 13px; }
.header-actions { display: flex; gap: 8px; }

/* ── Buttons ── */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 14px; border-radius: var(--radius);
  border: 1px solid var(--border); background: var(--surface2);
  color: var(--text); font-size: 13px; font-weight: 600;
  cursor: pointer; transition: background .15s, border-color .15s;
}
.btn:hover { background: var(--border); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn-primary:hover { background: #4090e0; border-color: #4090e0; }
.btn-success { background: var(--accent2); border-color: var(--accent2); color: #000; }
.btn-success:hover { background: #2ea043; }

/* ── Layout ── */
.main {
  display: flex; flex: 1; overflow: hidden;
}

/* ── Left panel (editor) ── */
.editor {
  width: 340px; min-width: 340px;
  overflow-y: auto; padding: 16px;
  border-right: 1px solid var(--border);
  background: var(--surface);
  display: flex; flex-direction: column; gap: 16px;
}
.section-title {
  font-size: 11px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .08em; color: var(--text2);
  padding-bottom: 6px; border-bottom: 1px solid var(--border);
  margin-bottom: -8px;
}
.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-size: 12px; color: var(--text2); font-weight: 500; }
.field input[type="text"],
.field input[type="number"],
.field input[type="url"],
.field select,
.field textarea {
  padding: 7px 10px; border-radius: var(--radius);
  border: 1px solid var(--border); background: var(--bg);
  color: var(--text); font-size: 13px;
  font-family: inherit;
}
.field input:focus, .field select:focus, .field textarea:focus {
  outline: none; border-color: var(--accent);
  box-shadow: 0 0 0 2px rgba(88,166,255,.2);
}
.field textarea { resize: vertical; min-height: 48px; }
.row { display: flex; gap: 8px; }
.row .field { flex: 1; }
.color-row { display: flex; align-items: center; gap: 8px; }
.color-row input[type="color"] {
  width: 36px; height: 30px; border: 1px solid var(--border);
  border-radius: 6px; cursor: pointer; background: none; padding: 1px;
}
.toggle-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 6px 0;
}
.toggle-row span { font-size: 13px; }
.toggle {
  position: relative; width: 40px; height: 22px;
  background: var(--border); border-radius: 11px;
  cursor: pointer; transition: background .2s;
}
.toggle.active { background: var(--accent); }
.toggle::after {
  content: ''; position: absolute; top: 2px; left: 2px;
  width: 18px; height: 18px; background: #fff;
  border-radius: 50%; transition: transform .2s;
}
.toggle.active::after { transform: translateX(18px); }
.image-upload-area {
  border: 2px dashed var(--border); border-radius: var(--radius);
  padding: 16px; text-align: center; cursor: pointer;
  color: var(--text2); font-size: 12px; transition: border-color .2s;
  position: relative; overflow: hidden;
}
.image-upload-area:hover { border-color: var(--accent); }
.image-upload-area img {
  max-width: 100%; max-height: 80px; display: block;
  margin: 0 auto; border-radius: 4px;
}
.image-upload-area input { display: none; }

/* ── Right panel (preview) ── */
.preview-panel {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 24px; overflow: auto;
  background: var(--bg);
}
.preview-label {
  font-size: 12px; color: var(--text2); margin-bottom: 12px;
  display: flex; align-items: center; gap: 8px;
}
.preview-label .size-badge {
  background: var(--surface2); border: 1px solid var(--border);
  padding: 2px 8px; border-radius: 4px; font-weight: 600;
  font-size: 11px;
}
.preview-container {
  border: 1px solid var(--border);
  background: #0a0a0a;
  box-shadow: 0 8px 32px rgba(0,0,0,.4);
  border-radius: 4px;
  position: relative;
}

/* ── Banner sizes ── */
.size-selector {
  display: flex; gap: 4px; flex-wrap: wrap;
}
.size-btn {
  padding: 5px 10px; border-radius: 6px;
  border: 1px solid var(--border); background: var(--surface2);
  color: var(--text2); font-size: 11px; font-weight: 600;
  cursor: pointer; transition: all .15s;
}
.size-btn:hover { color: var(--text); }
.size-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

/* ── Responsive ── */
@media (max-width: 800px) {
  .main { flex-direction: column; }
  .editor { width: 100%; min-width: 0; max-height: 45vh; border-right: none; border-bottom: 1px solid var(--border); }
  .preview-container { transform: scale(.8); transform-origin: top center; }
}
</style>
</head>
<body>

<!-- ════ HEADER ════ -->
<div class="header">
  <h1>Bannerieditori <span>— HTML5-display-mainokset</span></h1>
  <div class="header-actions">
    <button class="btn" onclick="loadTemplate()">📋 Esikuva</button>
    <button class="btn btn-primary" onclick="exportAd()">⬇ Vie mainos</button>
    <button class="btn btn-success" onclick="exportPreview()">👁 Vie esikatselu</button>
  </div>
</div>

<!-- ════ MAIN ════ -->
<div class="main">

  <!-- ── Editor Panel ── -->
  <div class="editor">

    <!-- Size -->
    <div>
      <div class="section-title">Koko</div>
      <div style="padding-top:8px">
        <div class="size-selector" id="sizeSelector">
          <button class="size-btn active" data-w="300" data-h="250">300×250</button>
          <button class="size-btn" data-w="728" data-h="90">728×90</button>
          <button class="size-btn" data-w="160" data-h="600">160×600</button>
          <button class="size-btn" data-w="320" data-h="50">320×50</button>
          <button class="size-btn" data-w="300" data-h="600">300×600</button>
          <button class="size-btn" data-w="970" data-h="250">970×250</button>
        </div>
      </div>
    </div>

    <!-- Content -->
    <div>
      <div class="section-title">Sisältö</div>
      <div style="padding-top:8px;display:flex;flex-direction:column;gap:10px">
        <div class="field">
          <label>Brändi</label>
          <input type="text" id="fBrand" value="AurinkoMatkat" oninput="updatePreview()">
        </div>
        <div class="field">
          <label>Otsikko</label>
          <input type="text" id="fHeadline" value="Kreikka" oninput="updatePreview()">
        </div>
        <div class="field">
          <label>Alaotsikko</label>
          <input type="text" id="fSubtext" value="viikkoloma" oninput="updatePreview()">
        </div>
        <div class="field">
          <label>Hyödyt / lisätieto</label>
          <input type="text" id="fPerks" value="Majoitus · Aamupala · Lento mukaan" oninput="updatePreview()">
        </div>
        <div class="row">
          <div class="field">
            <label>Hinta</label>
            <input type="text" id="fPrice" value="389 €" oninput="updatePreview()">
          </div>
          <div class="field">
            <label>Hinnan teksti</label>
            <input type="text" id="fPriceLabel" value="Alkaen" oninput="updatePreview()">
          </div>
        </div>
        <div class="row">
          <div class="field">
            <label>CTA-teksti</label>
            <input type="text" id="fCta" value="Varaa nyt →" oninput="updatePreview()">
          </div>
          <div class="field">
            <label>URL-osoite</label>
            <input type="url" id="fUrl" value="https://example.com/kreikka" oninput="updatePreview()">
          </div>
        </div>
        <div class="field">
          <label>Lakahuomautus</label>
          <input type="text" id="fLegal" value="Kuvitteellinen demo" oninput="updatePreview()">
        </div>
      </div>
    </div>

    <!-- Colors -->
    <div>
      <div class="section-title">Värit</div>
      <div style="padding-top:8px;display:flex;flex-direction:column;gap:10px">
        <div class="row">
          <div class="field">
            <label>Otsikon väri</label>
            <div class="color-row">
              <input type="color" id="fAccentColor" value="#f0d078" oninput="updatePreview()">
              <input type="text" value="#f0d078" style="flex:1" oninput="document.getElementById('fAccentColor').value=this.value;updatePreview()">
            </div>
          </div>
        </div>
        <div class="row">
          <div class="field">
            <label>CTA-väri</label>
            <div class="color-row">
              <input type="color" id="fCtaBg" value="#ffffff" oninput="updatePreview()">
              <input type="text" value="#ffffff" style="flex:1" oninput="document.getElementById('fCtaBg').value=this.value;updatePreview()">
            </div>
          </div>
          <div class="field">
            <label>CTA tekstin väri</label>
            <div class="color-row">
              <input type="color" id="fCtaFg" value="#1a1208" oninput="updatePreview()">
              <input type="text" value="#1a1208" style="flex:1" oninput="document.getElementById('fCtaFg').value=this.value;updatePreview()">
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Background -->
    <div>
      <div class="section-title">Tausta</div>
      <div style="padding-top:8px;display:flex;flex-direction:column;gap:8px">
        <div class="field">
          <label>Taustan tyyppi</label>
          <select id="fBgType" onchange="onBgTypeChange();updatePreview()">
            <option value="color">Yksivärinen</option>
            <option value="gradient">CSS-asteikko</option>
            <option value="image">Kuva (data-URI)</option>
          </select>
        </div>
        <div class="field" id="bgColorField">
          <label>Taustan väri</label>
          <div class="color-row">
            <input type="color" id="fBgColor1" value="#1a1208" oninput="updatePreview()">
            <input type="text" value="#1a1208" style="flex:1" oninput="document.getElementById('fBgColor1').value=this.value;updatePreview()">
          </div>
        </div>
        <div class="field" id="bgGradFields" style="display:none">
          <label>Asteikon väri 1</label>
          <div class="color-row" style="margin-bottom:6px">
            <input type="color" id="fBgGrad1" value="#2a1a0a" oninput="updatePreview()">
            <input type="text" value="#2a1a0a" style="flex:1" oninput="document.getElementById('fBgGrad1').value=this.value;updatePreview()">
          </div>
          <label>Asteikon väri 2</label>
          <div class="color-row">
            <input type="color" id="fBgGrad2" value="#0e0b04" oninput="updatePreview()">
            <input type="text" value="#0e0b04" style="flex:1" oninput="document.getElementById('fBgGrad2').value=this.value;updatePreview()">
          </div>
          <label style="margin-top:4px">Suunta</label>
          <select id="fBgGradDir" onchange="updatePreview()">
            <option value="180deg">Ala → Ylös</option>
            <option value="0deg">Ylös → Ala</option>
            <option value="90deg">Vasen → Oikea</option>
            <option value="45deg">Ylävasen → Alaoikea</option>
          </select>
        </div>
        <div class="field" id="bgImageField" style="display:none">
          <label>Lataa kuva</label>
          <div class="image-upload-area" id="imageUploadArea" onclick="document.getElementById('fBgImage').click()">
            <span id="imagePlaceholder">+ Lataa kuva tähän</span>
            <input type="file" id="fBgImage" accept="image/*" onchange="onImageUpload(event)">
          </div>
          <div style="margin-top:4px;display:flex;gap:6px">
            <button class="btn" style="font-size:11px;padding:4px 10px" onclick="loadSampleImage()">Käytä esimerkkiä</button>
            <button class="btn" style="font-size:11px;padding:4px 10px" onclick="removeImage()">Poista kuva</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Overlay -->
    <div>
      <div class="section-title">Päällekkäiskerros (scrim)</div>
      <div style="padding-top:8px;display:flex;flex-direction:column;gap:8px">
        <div class="toggle-row">
          <span>Käytä hämärtyystä</span>
          <div class="toggle active" id="toggleScrim" onclick="this.classList.toggle('active');updatePreview()"></div>
        </div>
        <div class="field">
          <label>Yläosan hämärtyminen</label>
          <input type="text" id="fScrimTop" value="rgba(8,6,4,.45)" oninput="updatePreview()" placeholder="esim. rgba(0,0,0,.5)">
        </div>
        <div class="field">
          <label>Alaosan hämärtyminen</label>
          <input type="text" id="fScrimBot" value="rgba(8,6,4,.72)" oninput="updatePreview()" placeholder="esim. rgba(0,0,0,.8)">
        </div>
      </div>
    </div>

    <!-- Animation -->
    <div>
      <div class="section-title">Animaatio</div>
      <div style="padding-top:8px;display:flex;flex-direction:column;gap:8px">
        <div class="toggle-row">
          <span>Animaatiot päällä</span>
          <div class="toggle active" id="toggleAnim" onclick="this.classList.toggle('active');updatePreview()"></div>
        </div>
        <div class="field">
          <label>Syklin kesto (s)</label>
          <input type="number" id="fDuration" value="8" min="4" max="20" step="1" oninput="updatePreview()">
        </div>
      </div>
    </div>

  </div>

  <!-- ── Preview Panel ── -->
  <div class="preview-panel">
    <div class="preview-label">
      Esikatselu
      <span class="size-badge" id="sizeBadge">300 × 250 px</span>
    </div>
    <div class="preview-container" id="previewContainer">
      <!-- Banner injected here -->
    </div>
  </div>

</div>

<!-- ════ JAVASCRIPT ════ -->
<script>
/* ─── State ─── */
let bannerW = 300, bannerH = 250;
let bgImageDataUri = null;

/* ─── Size selector ─── */
document.getElementById('sizeSelector').addEventListener('click', e => {
  const btn = e.target.closest('.size-btn');
  if (!btn) return;
  document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  bannerW = parseInt(btn.dataset.w);
  bannerH = parseInt(btn.dataset.h);
  document.getElementById('sizeBadge').textContent = bannerW + ' × ' + bannerH + ' px';
  updatePreview();
});

/* ─── Background type toggle ─── */
function onBgTypeChange() {
  const t = document.getElementById('fBgType').value;
  document.getElementById('bgColorField').style.display = t === 'color' ? '' : 'none';
  document.getElementById('bgGradFields').style.display = t === 'gradient' ? '' : 'none';
  document.getElementById('bgImageField').style.display = t === 'image' ? '' : 'none';
}

/* ─── Image upload ─── */
function onImageUpload(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    bgImageDataUri = ev.target.result;
    const area = document.getElementById('imageUploadArea');
    document.getElementById('imagePlaceholder').style.display = 'none';
    let img = area.querySelector('img');
    if (!img) { img = document.createElement('img'); area.appendChild(img); }
    img.src = bgImageDataUri;
    updatePreview();
  };
  reader.readAsDataURL(file);
}
function loadSampleImage() {
  const candidates = ['assets/desert-golden.png', './assets/desert-golden.png', '/assets/desert-golden.png'];
  (async () => {
    let lastErr;
    for (const path of candidates) {
      try {
        const r = await fetch(path);
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const blob = await r.blob();
        const dataUri = await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = ev => resolve(ev.target.result);
          reader.onerror = reject;
          reader.readAsDataURL(blob);
        });
        bgImageDataUri = dataUri;
        const area = document.getElementById('imageUploadArea');
        document.getElementById('imagePlaceholder').style.display = 'none';
        let img = area.querySelector('img');
        if (!img) { img = document.createElement('img'); area.appendChild(img); }
        img.src = bgImageDataUri;
        // switch bg type to image if control exists
        const sel = document.getElementById('fBgType');
        if (sel) { sel.value = 'image'; if (typeof onBgTypeChange === 'function') onBgTypeChange(); }
        updatePreview();
        return;
      } catch (e) { lastErr = e; }
    }
    alert('Esimerkkikuva ei löydy. Avaa editori paikallisella palvelimella (python3 -m http.server) tai lataa oma kuva.');
  })();
}
function removeImage() {
  bgImageDataUri = null;
  const area = document.getElementById('imageUploadArea');
  document.getElementById('imagePlaceholder').style.display = '';
  const img = area.querySelector('img');
  if (img) img.remove();
  document.getElementById('fBgImage').value = '';
  updatePreview();
}

/* ─── Gather values ─── */
function V(id) { return document.getElementById(id).value; }
function getBgState() {
  return {
    type: V('fBgType'),
    color1: V('fBgColor1'),
    grad1: V('fBgGrad1'), grad2: V('fBgGrad2'),
    gradDir: V('fBgGradDir'),
    imageUri: bgImageDataUri
  };
}

/* ─── Build ad HTML ─── */
function buildAdHTML() {
  const brand = V('fBrand');
  const headline = V('fHeadline');
  const subtext = V('fSubtext');
  const perks = V('fPerks');
  const price = V('fPrice');
  const priceLabel = V('fPriceLabel');
  const cta = V('fCta');
  const url = V('fUrl');
  const legal = V('fLegal');
  const accentColor = V('fAccentColor');
  const ctaBg = V('fCtaBg');
  const ctaFg = V('fCtaFg');
  const dur = V('fDuration') || '8';
  const animOn = document.getElementById('toggleAnim').classList.contains('active');
  const useScrim = document.getElementById('toggleScrim').classList.contains('active');
  const bg = getBgState();
  const animClass = animOn ? '' : ' style="animation:none !important"';
  const animOffCSS = animOn ? '' : `
*{animation:none !important;opacity:1 !important;transform:none !important}
  `;

  // Background
  let bgCSS = '';
  if (bg.type === 'color') {
    bgCSS = 'background:' + bg.color1;
  } else if (bg.type === 'gradient') {
    bgCSS = 'background:linear-gradient(' + bg.gradDir + ',' + bg.grad1 + ',' + bg.grad2 + ')';
  } else {
    bgCSS = 'background:url(\'' + bg.imageUri + '\') center/cover no-repeat';
  }

  // Scrim
  let scrimHTML = '';
  if (useScrim) {
    scrimHTML = '<div class="scrim" aria-hidden="true"></div>';
  }

  // Build complete HTML
  return `<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="ad.size" content="width=${bannerW},height=${bannerH}">
<title>${brand} — ${headline}</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:${bannerW}px;height:${bannerH}px;overflow:hidden}
#banner{display:block;width:${bannerW}px;height:${bannerH}px;overflow:hidden;position:relative;text-decoration:none;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;${bgCSS}}
.bg{position:absolute;inset:0;z-index:0;${bg.type==='image'?'animation:drift '+dur+'s ease-in-out infinite':''}}
${bg.type==='image'?'.bg{background:url(\''+bg.imageUri+'\') center/cover no-repeat}':''}
@keyframes drift{from{transform:scale(1.04)}to{transform:scale(1.08)}}
${scrimHTML}
.content{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;padding:10px 12px 22px}
.brand{display:flex;align-items:center;gap:7px;flex-shrink:0;animation:seqBrand ${dur}s ease-in-out infinite}
.logo{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6c8,#ffcc4d 55%,#e8a020);box-shadow:0 0 10px rgba(255,200,80,.45);flex-shrink:0;animation:logoGlow ${dur}s ease-in-out infinite}
.brand-name{font-size:11px;font-weight:700;letter-spacing:.04em;text-shadow:0 1px 4px rgba(0,0,0,.55)}
.center-stack{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;min-height:0}
h1{font-size:24px;line-height:1.05;font-weight:800;text-shadow:0 2px 10px rgba(0,0,0,.55);animation:seqTitle ${dur}s ease-in-out infinite}
h1 span{display:block;font-size:14px;font-weight:700;color:${accentColor};margin-top:3px;animation:seqSub ${dur}s ease-in-out infinite}
.perks{font-size:9px;letter-spacing:.02em;text-shadow:0 1px 4px rgba(0,0,0,.5);animation:seqPerks ${dur}s ease-in-out infinite}
.bottom{display:flex;align-items:center;justify-content:space-between;gap:6px;flex-shrink:0;width:100%}
.price{display:flex;flex-direction:column;animation:seqPrice ${dur}s ease-in-out infinite}
.price .from{font-size:8px;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.price .amt{font-size:20px;font-weight:800;color:${accentColor};line-height:1.1;text-shadow:0 2px 8px rgba(0,0,0,.5)}
.cta{background:${ctaBg};color:${ctaFg};font-weight:800;font-size:11px;padding:8px 11px;border-radius:999px;white-space:nowrap;box-shadow:0 6px 16px rgba(0,0,0,.35);animation:seqCta ${dur}s ease-in-out infinite}

/* ─── Update live preview ─── */
function updatePreview() {
  const html = buildAdHTML();
  const container = document.getElementById('previewContainer');
  // Use a sandboxed iframe for safe preview
  container.innerHTML = '';
  const iframe = document.createElement('iframe');
  iframe.srcdoc = html;
  iframe.style.border = 'none';
  iframe.style.width = bannerW + 'px';
  iframe.style.height = bannerH + 'px';
  iframe.style.display = 'block';
  iframe.style.background = '#000';
  container.appendChild(iframe);
}

/* ─── Export standalone ad ─── */
function exportAd() {
  const html = buildAdHTML();
  const blob = new Blob([html], { type: 'text/html' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const safeBrand = V('fBrand').replace(/[^a-zA-Z0-9]/g, '_');
  a.download = 'banner_' + bannerW + 'x' + bannerH + '_' + safeBrand + '.html';
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
}

  document.getElementById('fSubtext').value = 'viikkoloma';
  document.getElementById('fPerks').value = 'Majoitus · Aamupala · Lento mukaan';

  document.getElementById('fPriceLabel').value = 'Alkaen';
  document.getElementById('fCta').value = 'Varaa nyt →';

  document.getElementById('fLegal').value = 'Kuvitteellinen demo';
  document.getElementById('fAccentColor').value = '#f0d078';
  document.getElementById('fCtaBg').value = '#ffffff';
  document.getElementById('fCtaFg').value = '#1a1208';
  document.getElementById('fDuration').value = '8';
  document.getElementById('toggleAnim').classList.add('active');
  document.getElementById('toggleScrim').classList.add('active');
  document.getElementById('fBgType').value = 'image';
  onBgTypeChange();
  // Load sample image
  fetch('/assets/desert-golden.png')
    .then(r => r.blob()).then(blob => {
      const reader = new FileReader();
      reader.onload = ev => {
        bgImageDataUri = ev.target.result;
        const area = document.getElementById('imageUploadArea');
        document.getElementById('imagePlaceholder').style.display = 'none';
        let img = area.querySelector('img');
        if (!img) { img = document.createElement('img'); area.appendChild(img); }
        img.src = bgImageDataUri;
        updatePreview();
      };
      reader.readAsDataURL(blob);
    })
    .catch(() => {
      document.getElementById('fBgType').value = 'color';
      document.getElementById('fBgColor1').value = '#1a1208';
      onBgTypeChange();
      updatePreview();
    });
  updatePreview();
}
